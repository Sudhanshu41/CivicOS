# CivicOS — Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# %%(rev)s    - revision id
# %%(slug)s   - slug based on the revision message
# %%(epoch)s  - seconds since epoch
file_template = %%(epoch)s_%%(slug)s

# Timezone for timestamps in migration filenames
# timezone = UTC

# Max length of slug component in filename
truncate_slug_length = 40

# Version table name (default: alembic_version)
version_table = alembic_version

# sqlalchemy.url is overridden at runtime by env.py from pydantic-settings
sqlalchemy.url =

# ── Logging ────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
